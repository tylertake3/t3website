- name: page-spacts
  label: SPACTs page text
  file: src/content/pages/spacts.json
  description: All the wording on the SPACTs page.
  fields:
    - name: meta
      label: Search & sharing
      widget: object
      collapsed: true
      fields:
        - { name: title, label: Browser tab title, widget: string, hint: 'Shows in the browser tab and as the headline in Google results.' }
        - { name: description, label: Google description, widget: text, hint: 'The grey summary under the title in Google results. Around 150–160 characters works best.' }
        - { name: ogTitle, label: Title when shared on social, widget: string, hint: 'Used when someone pastes a link to this page into WhatsApp, Instagram, LinkedIn and so on.' }
        - { name: ogDescription, label: Description when shared on social, widget: text, hint: 'The short line under the title on a shared link preview.' }
        - { name: footerTitle, label: Footer headline, widget: string, hint: 'The big line above the contact details at the very bottom of the page.' }
        - name: footerLinks
          label: Footer buttons
          widget: list
          hint: 'The outlined buttons in the footer, pointing visitors to other pages. Reorder, add or remove them here.'
          fields:
            - { name: label, label: Button text, widget: string, hint: 'The arrow → is part of the text, so keep it if you want it.' }
            - { name: href, label: Page it opens, widget: string, hint: 'A path on this site, such as /dancers.' }

    - name: hero
      label: Top of page
      widget: object
      hint: 'The full-width opening block with the production photos fading behind the title.'
      fields:
        - { name: eyebrow, label: Small line above the title, widget: string, hint: 'Written in capitals.' }
        - { name: title, label: Page title, widget: string, hint: 'The very large word at the top. Always shown in capitals.' }
        - { name: strapline, label: Opening sentence, widget: text, hint: 'The line under the title.' }
        - { name: creditLabel, label: Photo credit label, widget: string, hint: 'The small line in the bottom corner above the production name, currently AS SEEN ON.' }
        - name: slides
          label: Rotating photos
          widget: list
          hint: 'The background photos that fade from one to the next, every five seconds, in this order. The first one shows when the page loads. Add, reorder or remove them here.'
          fields:
            - { name: image, label: Photo file, widget: string, hint: 'The path to the photo, such as /uploads/my-photo.webp. Upload images to the uploads folder first.' }
            - { name: production, label: Production name, widget: string, hint: 'The name shown in the bottom corner while this photo is on screen. Written in capitals.' }

    - name: what
      label: What is a SPACT
      widget: object
      hint: 'The section just below the photo explaining what a SPACT is.'
      fields:
        - { name: eyebrow, label: Small line above the heading, widget: string, hint: 'Written in capitals.' }
        - { name: heading, label: Heading, widget: string, hint: 'The large heading. Always shown in capitals.' }
        - { name: paragraph, label: Paragraph, widget: text }
        - { name: linkLabel, label: Link text, widget: string, hint: 'The link under the paragraph. The arrow → is part of the text, so keep it if you want it.' }
        - { name: linkHref, label: Page the link opens, widget: string, hint: 'A path on this site, such as /what-is-a-spact.' }

    - name: disciplines
      label: Disciplines
      widget: object
      hint: 'The three-column grid of numbered skills.'
      fields:
        - { name: heading, label: Section heading, widget: string, hint: 'The large heading on the left. Always shown in capitals.' }
        - { name: kicker, label: Small line on the right, widget: string, hint: 'The short coloured line opposite the heading, currently NINE CORE AREAS. Update it if you change how many skills are listed.' }
        - name: items
          label: Skills
          widget: list
          hint: 'Add, reorder or remove skills here. They fill the grid three across.'
          fields:
            - { name: number, label: Number, widget: string, hint: 'The small number on the left, e.g. 01. Renumber them yourself if you reorder the list.' }
            - { name: title, label: Skill, widget: string }
        - { name: note, label: Note under the grid, widget: text, hint: 'The small grey sentence below the grid.' }

    - name: distinctions
      label: SPACT, stunt performer, supporting artist
      widget: object
      hint: 'The dark section with the three clickable role cards and the annotated production frame.'
      fields:
        - { name: eyebrow, label: Small line above the heading, widget: string, hint: 'The short orange line above the heading, written in capitals, e.g. THE DISTINCTIONS.' }
        - { name: heading, label: Section heading, widget: string, hint: 'Always shown in capitals.' }
        - { name: intro, label: Introduction paragraph, widget: text, hint: 'The paragraph directly under the heading.' }
        - { name: selectPrompt, label: Instruction above the cards, widget: string, hint: 'The small grey line telling visitors they can click a role. Written in capitals.' }
        - { name: roleFlagLabel, label: "\"In frame\" flag on the chosen card", widget: string, hint: 'Appears under whichever role card is currently selected. The same wording is used on all three cards.' }
        - name: roles
          label: Role cards
          widget: list
          hint: 'The three cards side by side. Keep them in this order — supporting artist, SPACT, stunt performer — so they line up with the frame below.'
          fields:
            - { name: role, label: Which role this card is, widget: string, hint: 'Must be exactly sa, spact or stunt. This links the card to the matching outlines in the photo below, so do not change it unless you know what it does.' }
            - { name: title, label: Card title, widget: string, hint: 'Written in capitals.' }
            - { name: body, label: Card description, widget: text }
        - { name: frameAlt, label: Production frame description for screen readers, widget: text, hint: 'Describes the large annotated photo for visitors who cannot see it. Not shown on screen.' }
        - name: scenes
          label: Annotated scenes
          widget: list
          hint: 'The photos behind the role cards. Visitors move through them with the NEXT SCENE button, and the page loops back to the first one at the end. The first scene here is the one that shows when the page loads.'
          fields:
            - { name: image, label: Scene photo, widget: string, hint: 'The path to the photo, e.g. /uploads/my-photo.png.' }
            - { name: title, label: Scene caption, widget: string, hint: 'The small grey line under the photo, e.g. SC. 12 — THE SIEGE · ONE FRAME, THREE ROLES.' }
            - name: spots
              label: Outlined people in this photo
              widget: list
              hint: 'One entry per person marked out with a box and a label. The position settings decide where the box sits, so change those only if the photo itself changes.'
              fields:
                - { name: role, label: Which role this person is, widget: string, hint: 'Must be exactly sa, spact or stunt. This decides the outline colour and which role card reveals them.' }
                - { name: label, label: Label text, widget: string, hint: 'The wording in the little box beside the person. Keep it short so it fits in the frame.' }
                - { name: side, label: Label position, widget: string, hint: 'Type above to hang the label over the box, or below to drop it underneath.' }
                - { name: left, label: 'Position: distance from left edge (%)', widget: number, hint: 'Percentage across the photo, 0 at the left edge and 100 at the right.' }
                - { name: top, label: 'Position: distance from top edge (%)', widget: number, hint: 'Percentage down the photo, 0 at the top and 100 at the bottom.' }
                - { name: width, label: 'Position: box width (%)', widget: number, hint: 'Percentage of the photo width.' }
                - { name: height, label: 'Position: box height (%)', widget: number, hint: 'Percentage of the photo height.' }
                - { name: delay, label: 'Timing: seconds before this label appears', widget: number, hint: 'Staggers the labels so they do not all pop up at once.' }
        - name: legend
          label: Key under the photo
          widget: object
          hint: 'The small buttons under the photo that filter the frame down to one role.'
          fields:
            - { name: stunt, label: Stunt button text, widget: string, hint: 'The pale dash before the word is added automatically.' }
            - { name: spact, label: SPACT button text, widget: string, hint: 'The orange dash before the word is added automatically.' }
            - { name: sa, label: Supporting artist button text, widget: string, hint: 'The dotted dash before the word is added automatically.' }
            - { name: nextButton, label: Next scene button text, widget: string, hint: 'The outlined button that moves to the next photo. The arrow → is part of the text.' }
        - { name: note, label: Closing note, widget: text, hint: 'The small grey paragraph at the end of this section.' }

    - name: film
      label: For film & television
      widget: object
      hint: 'The dark section with the three production photos.'
      fields:
        - { name: eyebrow, label: Small line above the heading, widget: string, hint: 'Written in capitals.' }
        - { name: heading, label: Heading, widget: string, hint: 'The large heading. Always shown in capitals.' }
        - { name: paragraph, label: Paragraph, widget: text, hint: 'The text on the right, ending with the line that introduces the photos.' }
        - name: tiles
          label: Production photos
          widget: list
          hint: 'Three photos fit the row neatly. Add, reorder or remove them here.'
          fields:
            - { name: caption, label: Production name, widget: string, hint: 'The caption under the photo. Written in capitals.' }
            - { name: alt, label: Photo description, widget: string, hint: 'Describes the photo for people using a screen reader and for Google. Not shown on the page.' }
            - { name: image, label: Photo file, widget: string, hint: 'The path to the image, such as /uploads/w1280.jpg. Upload images to the uploads folder first.' }

    - name: commercial
      label: For commercial & brand
      widget: object
      hint: 'The section listing the kinds of commercial work SPACTs are booked for.'
      fields:
        - { name: eyebrow, label: Small line above the heading, widget: string, hint: 'Written in capitals.' }
        - { name: heading, label: Heading, widget: string, hint: 'The large heading. Always shown in capitals.' }
        - { name: items, label: List rows, widget: list, hint: 'One sentence per row, each on its own line with a rule between. Add, reorder or remove rows here.' }

    - name: why
      label: Why book through Take 3
      widget: object
      hint: 'The three numbered cards at the bottom of the page.'
      fields:
        - { name: heading, label: Section heading, widget: string, hint: 'The large heading above the cards. Always shown in capitals.' }
        - name: cards
          label: Cards
          widget: list
          hint: 'Three cards fit the row neatly. Add, reorder or remove them here.'
          fields:
            - { name: number, label: Card number, widget: string, hint: 'The small number above the title, e.g. 01. Renumber them yourself if you reorder the cards.' }
            - { name: title, label: Card title, widget: string }
            - { name: body, label: Card text, widget: text }
