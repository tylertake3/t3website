- name: page-about
  label: Who We Are page text
  file: src/content/pages/about.json
  description: All the wording on the Who We Are page.
  fields:
    - name: meta
      label: Search & sharing
      widget: object
      collapsed: true
      hint: The words Google and social media show. Not visible on the page itself.
      fields:
        - { name: title, label: Browser tab & Google title, widget: string }
        - { name: description, label: Google description, widget: text, hint: Around 150-160 characters works best. }
        - { name: ogTitle, label: Title when shared on social, widget: string }
        - { name: ogDescription, label: Description when shared on social, widget: text }
        - { name: footerTitle, label: Footer headline, widget: string, hint: The big line in the contact strip at the bottom of the page. }
        - { name: footerIntro, label: Footer line under the headline, widget: text, required: false }
    - name: hero
      label: Top of the page
      widget: object
      fields:
        - { name: eyebrow, label: Small line above the headline, widget: string }
        - { name: heading, label: Headline, widget: string }
        - { name: lede, label: Opening paragraph, widget: text }
        - { name: image, label: Banner photo, widget: image, required: false, hint: 'The photo behind the headline. Leave empty for a plain dark banner.' }
        - { name: focus, label: Photo hold point, widget: string, required: false, hint: 'Which part of the photo stays in view when the banner is cropped, e.g. "center 55%". Leave empty to centre it.' }
    - name: story
      label: About the agency
      widget: object
      hint: The paragraphs directly under the banner.
      fields:
        - { name: kicker, label: Small label, widget: string, hint: The small label above the paragraphs. Leave blank to hide it. }
        - { name: image, label: Photograph, widget: image, required: false, hint: A portrait-shaped photo beside the story, of the team or the office. Shows an empty plate until one is added. }
        - { name: imageAlt, label: Photo description, widget: string, required: false }
        - { name: caption, label: Photo caption, widget: string, required: false, hint: The small line under the photo. Leave blank to hide it. }
        - { name: paragraphs, label: Paragraphs, widget: list, hint: One entry per paragraph. }
    - name: team
      label: The team
      widget: object
      hint: The six people and the office dog. Each card shows a headshot, name, job title and email; hovering or tapping the photo reveals a short bio.
      fields:
        - { name: kicker, label: Small label beside the heading, widget: string }
        - { name: heading, label: Heading, widget: string }
        - { name: body, label: One line under the heading, widget: text }
        - { name: slotLabel, label: Placeholder caption, widget: string, hint: Shown on each empty photograph plate until a picture is added. }
        - { name: namePending, label: Placeholder name, widget: string, hint: Shown in place of a name until one is filled in. }
        - { name: bioPending, label: Placeholder for a missing bio, widget: string }
        - { name: emailLabel, label: Label before the email address, widget: string, hint: Read aloud to visitors using a screen reader. Not shown on screen. }
        - name: members
          label: People
          label_singular: Person
          widget: list
          hint: Add, reorder or remove people. The dog counts as one of them.
          fields:
            - { name: name, label: Name, widget: string, required: false }
            - { name: role, label: Job title, widget: string, required: false }
            - { name: email, label: Email address, widget: string, required: false, hint: Leave blank to show no email. }
            - { name: bio, label: About them, widget: text, required: false, hint: Two sentences that appear over the photo on hover or tap - background, loves and interests, a favourite job. }
            - { name: image, label: Photograph, widget: image, required: false }
            - { name: alt, label: Photo description, widget: string, required: false, hint: 'Read aloud to visitors who cannot see the photo. Not shown on screen.' }
            - { name: dog, label: This one is the dog, widget: boolean, required: false, default: false }
    - name: values
      label: What we believe
      widget: object
      hint: Four short statements about how the team works. Kept deliberately brief.
      fields:
        - { name: kicker, label: Small label beside the heading, widget: string }
        - { name: heading, label: Heading, widget: string }
        - name: items
          label: Statements
          label_singular: Statement
          widget: list
          fields:
            - { name: title, label: Statement, widget: string, hint: 'A few words, for example "We meet everyone"' }
            - { name: detail, label: One line of explanation, widget: text }
    - name: quotes
      label: What people say about us
      widget: object
      hint: Quotes about the team itself, rather than about the roster. The plates stay empty until real quotes are supplied.
      fields:
        - { name: kicker, label: Small label beside the heading, widget: string }
        - { name: heading, label: Heading, widget: string }
        - { name: todo, label: Note about what is still needed, widget: text }
        - name: slots
          label: Quote plates
          label_singular: Plate
          widget: list
          fields:
            - { name: slotLabel, label: Placeholder caption, widget: string }
            - { name: text, label: Quote, widget: text, required: false, hint: Leave empty to show the placeholder. }
            - { name: name, label: Person's name, widget: string, required: false }
            - { name: role, label: Role or relationship to the team, widget: string, required: false }
            - { name: credits, label: Production, widget: string, required: false, hint: A production named in the shared logo library, e.g. Strictly Come Dancing. Its logo shows under the role. }
