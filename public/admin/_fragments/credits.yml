- name: page-credits
  label: Credits page text
  file: src/content/pages/credits.json
  description: All the wording on the Credits page. The testimonials themselves are edited under Reviews.
  fields:
    - name: meta
      label: Search & sharing
      widget: object
      collapsed: true
      hint: The words Google and social media show. Not visible on the page itself.
      fields:
        - { name: title, label: Browser tab & Google title, widget: string }
        - { name: description, label: Google description, widget: text, hint: Around 150-160 characters works best. }
        - { name: ogTitle, label: Title when shared on social, widget: string }
        - { name: ogDescription, label: Description when shared on social, widget: text }
        - { name: footerTitle, label: Footer headline, widget: string, hint: The big line in the contact strip at the bottom of the page. }
    - name: hero
      label: Top of the page
      widget: object
      fields:
        - { name: eyebrow, label: Small line above the headline, widget: string }
        - { name: heading, label: Headline, widget: string }
        - { name: lede, label: Opening paragraph, widget: text }
    - name: figures
      label: Headline figures
      widget: object
      hint: The three numbers near the top. They count up as the page is scrolled.
      fields:
        - { name: kicker, label: Small label beside the heading, widget: string }
        - { name: heading, label: Heading, widget: string }
        - name: items
          label: Figures
          label_singular: Figure
          widget: list
          fields:
            - { name: number, label: The figure, widget: string, hint: 'For example 500+ or 1,500+ or 2019' }
            - { name: label, label: What it counts, widget: string }
    - name: productions
      label: Production credits
      widget: object
      hint: The wall of posters below this copy is built from the artwork in the site's poster folder, so it is not edited here.
      fields:
        - { name: kicker, label: Small label beside the heading, widget: string }
        - { name: heading, label: Heading, widget: string }
        - { name: intro, label: Introduction, widget: text }
        - name: clearanceNote
          label: Clearance warning
          widget: text
          hint: Shown on the page in the highlight style until it is cleared out. Delete it once permission and embargo checks are signed off.
    - name: clients
      label: Client logos
      widget: object
      fields:
        - { name: kicker, label: Small label beside the heading, widget: string }
        - { name: heading, label: Heading, widget: string }
        - { name: body, label: Paragraph, widget: text }
        - name: artworkNote
          label: Note shown while no logo files exist
          widget: text
          hint: Disappears on its own as soon as logo artwork is added to the site.
    - name: testimonials
      label: Testimonials
      widget: object
      hint: The quotes themselves are added and reordered under Reviews. Only the wording around them is set here.
      fields:
        - { name: kicker, label: Small label beside the heading, widget: string }
        - { name: heading, label: Heading, widget: string }
        - { name: intro, label: Introduction, widget: text }
        - { name: emptyNote, label: Note shown when there are no reviews yet, widget: text }
