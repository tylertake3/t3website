  - name: homepage
    label: Homepage
    files:
      - name: hero
        label: Hero slideshow
        file: src/data/hero.json
        description: The full-screen photos that rotate at the top of the homepage.
        fields:
          - name: slides
            label: Slides
            widget: list
            fields:
              - { name: title, label: Production name, widget: string }
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Photo description, widget: string, hint: 'Read aloud to visitors who cannot see the photo.' }
              - name: focus
                label: Which part of the photo to keep
                widget: select
                required: false
                default: 'center 35%'
                hint: 'The banner is wider than most photos, so the top and bottom get trimmed. Pick the part that must stay in frame.'
                options:
                  - { label: 'Top of the photo', value: 'center top' }
                  - { label: 'Upper third — good for faces', value: 'center 25%' }
                  - { label: 'Slightly high (default)', value: 'center 35%' }
                  - { label: 'Dead centre', value: 'center center' }
                  - { label: 'Slightly low', value: 'center 65%' }
                  - { label: 'Bottom of the photo', value: 'center bottom' }

      - name: categories
        label: What we supply
        file: src/data/categories.json
        description: The scrolling row of talent categories on the homepage.
        fields:
          - name: categories
            label: Categories
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: label, label: Placeholder caption, widget: string }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: href, label: Links to, widget: string }

      - name: clients
        label: Client logos
        file: src/data/clients.json
        description: The logo wall. Each logo needs a version for the dark site and one for the light site.
        fields:
          - name: clients
            label: Logos
            widget: list
            fields:
              - { name: dark, label: Logo for dark background, widget: image }
              - { name: light, label: Logo for light background, widget: image }
              - { name: height, label: Height on screen (pixels), widget: number, value_type: int, default: 50 }
